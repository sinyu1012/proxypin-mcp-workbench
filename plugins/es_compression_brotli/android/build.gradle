group = 'com.proxypin'
version = '1.0.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'com.proxypin.es_compression_brotli'
    compileSdk 34

    sourceSets {
        main {
            // Prebuilt .so files from es_compression
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-base:18.3.0'
}
